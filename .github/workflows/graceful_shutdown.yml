name: Graceful shutdown

on:
  workflow_dispatch:
    inputs:
      binaries_release:
        description: 'release in THIS repo holding the yagna bundle to test'
        required: false
        default: 'stop-2'
      task_duration_sec:
        description: 'How long the task computes on the provider'
        required: false
        default: '180'

jobs:
  run_test:
    name: golemsp stop --graceful
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

#### The vm runtime, the router and gftp come from the usual release bundle.

      - name: Download and install binaries
        run: |
          /bin/bash download_binaries.sh

      - name: Install binaries
        run: |
          sudo mkdir -p /usr/lib/yagna
          sudo mv golem/downloaded/plugins /usr/lib/yagna/plugins
          sudo mv golem/downloaded/* /usr/bin/

#### `golemsp stop --graceful` is newer than the last official release, so yagna
#### itself is replaced with a pre-release build. That bundle is attached to a
#### release in THIS repository: golemfactory/yagna is private and the workflow's
#### GITHUB_TOKEN is scoped to yagna-setup, so it cannot read releases over there,
#### and the CDN download_binaries.sh uses only mirrors official releases (403 for
#### a pre-release tag). To test a newer yagna build, attach its
#### golem-provider-linux-*.tar.gz to a new release here and pass it as
#### `binaries_release`.

      - name: Install the yagna bundle under test
        env:
          GH_TOKEN: ${{ github.token }}
          BINARIES_RELEASE: ${{ github.event.inputs.binaries_release || 'stop-2' }}
        run: |
          gh release download "$BINARIES_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern 'golem-provider-linux-*.tar.gz' --dir yagna-release
          tar -xzf yagna-release/golem-provider-linux-*.tar.gz -C yagna-release
          bundle=$(find yagna-release -maxdepth 1 -type d -name 'golem-provider-linux-*')
          sudo install -m 755 "$bundle"/{yagna,ya-provider,golemsp} /usr/bin/
          sudo install -m 755 "$bundle/plugins/exe-unit" /usr/lib/yagna/plugins/exe-unit
          golemsp --version
          ya-provider --version
          # fail early and clearly if the bundle predates the feature
          golemsp stop --help | grep -q -- --graceful \
            || { echo "this yagna build has no 'golemsp stop --graceful'"; exit 1; }
          golemsp stop --help | grep -q -- --provider-only \
            || { echo "this yagna build has no 'golemsp stop --provider-only'"; exit 1; }

#### Central net router is responsible for local communication of the nodes

      - name: Run central-net router
        run: |
          ya-sb-router -l tcp://127.0.0.1:5555&
          echo CENTRAL_NET_HOST=127.0.0.1:5555 >> $GITHUB_ENV

      - name: Prepare runtime
        run: |
          python advanced/prepare_runtime.py --mode central --num-providers 1

#### No real funds: the erc20 driver is told to skip allocation validation
#### (YAGNA_DEV_SKIP_ALLOCATION_VALIDATION), so allocations validate as funded.

      - name: Configure requestor without funding
        run: |
          cd golem/requestor
          {
            echo "YAGNA_AUTOCONF_APPKEY=66iiOdkvV29"
            echo "YAGNA_APPKEY=66iiOdkvV29"
            echo "YA_PAYMENT_NETWORK=hoodi"
            echo "YAGNA_DEV_SKIP_ALLOCATION_VALIDATION=1"
          } >> .env
          cat .env

      - name: Run requestor
        run: |
          cd golem/requestor
          yagna service run&
          sleep 8
          yagna app-key list

#### `golemsp stop` reads the pid files from the default data directories
#### (~/.local/share/{yagna,ya-provider}) and ignores YAGNA_DATADIR / DATA_DIR,
#### so the provider node under test runs with the defaults. Only the requestor
#### keeps its own data dir - the two nodes are kept apart by GSB/API ports.

      - name: Prepare provider
        run: |
          cd golem/provider_0
          sed -i '/^YAGNA_DATADIR=/d;/^DATA_DIR=/d' .env
          echo "MEAN_CYCLIC_BCAST_INTERVAL=10sec" >> .env
          cat .env
          golemsp setup --no-interactive
          ya-provider preset update --no-interactive --name=vm --price="cpu=0.016" --price="duration=1.111"
          ya-provider preset list
        env:
          YA_CONSENT_EXTERNAL: "allow"

      - name: Run provider
        run: |
          sudo chown $USER /dev/kvm
          cd golem/provider_0
          yagna service run&
          sleep 8
          ya-provider run&
          # give the provider time to subscribe and broadcast its offer
          sleep 30
        env:
          YA_CONSENT_EXTERNAL: "allow"

#### The actual test: run a task, request a graceful stop while it computes,
#### and check that the task finishes before the provider goes down.

      - name: Run graceful shutdown test
        run: |
          echo "YAGNA_SUBNET=public" > examples/graceful-shutdown/.env
          examples/graceful-shutdown/run_test.sh
        env:
          YAGNA_APPKEY: 66iiOdkvV29
          YA_PAYMENT_NETWORK: hoodi
          TASK_DURATION_SEC: ${{ github.event.inputs.task_duration_sec || '180' }}
          PROVIDER_RUN_DIR: ${{ github.workspace }}/golem/provider_0
          YA_CONSENT_EXTERNAL: "allow"

#### Stop whatever is left running

      - name: Stop services
        if: always()
        run: |
          # best effort: the run may have failed before anything was provisioned
          golemsp stop || true
          (cd golem/requestor && yagna service shutdown) || true

      - name: Prepare logs
        if: always()
        run: |
          rm -rf ~/.local/share/ya-provider/exe-unit/cache
          tar --zstd -cf graceful_shutdown_logs.tar.zst \
            golem/requestor/yagnadir \
            ~/.local/share/ya-provider \
            ~/.local/share/yagna \
            examples/graceful-shutdown/*.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graceful_shutdown_logs.tar.zst
          path: graceful_shutdown_logs.tar.zst
