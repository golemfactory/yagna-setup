name: Demo: read private host file (transfer PoC)

# Devops-facing demonstration of the exe-unit `transfer` container
# path-traversal bug — see examples/exploit-path-traversal/README.md.
#
# Plants a one-off secret in /private/PRIVATE_USER_FILE.txt on the runner's
# own filesystem (outside any container volume), then runs a VM task on a
# local provider that requests that file via a traversal path. If the
# secret comes back, the job fails on purpose and prints it in a banner —
# the point is to make the impact obvious, not to gate a build.
#
# Read-only. Never touches real credentials. Manual dispatch only — do not
# wire this to push/schedule.

on:
  workflow_dispatch:
    inputs:
      empty:
        description: 'Empty option'
        required: false
        default: 'Not used'

jobs:
  run_demo:
    name: Read private host file via container escape
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

#### prepare binaries (current release — unpatched, for this demo)

      - name: Download and install binaries
        run: |
          /bin/bash download_binaries.sh

      - name: Install binaries
        run: |
          sudo mkdir -p /usr/lib/yagna
          sudo mv golem/downloaded/plugins /usr/lib/yagna/plugins
          sudo mv golem/downloaded/* /usr/bin/

#### Central net router

      - name: Run central-net router
        run: |
          ya-sb-router -l tcp://127.0.0.1:5555&
          echo CENTRAL_NET_HOST=127.0.0.1:5555 >> $GITHUB_ENV

#### Generate requestor/provider runtime directories

      - name: Prepare runtime
        run: |
          python advanced/prepare_runtime.py --mode central --num-providers 1

      - name: Configure requestor without funding
        run: |
          cd golem/requestor
          {
            echo "YAGNA_AUTOCONF_APPKEY=66iiOdkvV29"
            echo "YAGNA_APPKEY=66iiOdkvV29"
            echo "YA_PAYMENT_NETWORK=hoodi"
            echo "YAGNA_DEV_SKIP_ALLOCATION_VALIDATION=1"
          } >> .env

      - name: Run requestor
        run: |
          cd golem/requestor
          yagna service run&
          sleep 6
          yagna app-key list

#### Plant a private file OUTSIDE any container volume, on the runner's own
#### filesystem, before the provider starts. This is the target the demo
#### reads back — a one-off marker, never a real secret.

      - name: Plant private file
        run: |
          sudo install -d -m 755 -o "$USER" /private
          echo "PRIVATE_FILE_PATH=/private/PRIVATE_USER_FILE.txt" >> $GITHUB_ENV
          echo "PRIVATE_FILE_MESSAGE=PRIVATE_MESSAGE_${{ github.run_id }}_$(date -u +%s)" >> $GITHUB_ENV
      - name: Write private file
        run: |
          echo "This file lives on the HOST, outside any container volume." > "$PRIVATE_FILE_PATH"
          echo "Secret marker: $PRIVATE_FILE_MESSAGE" >> "$PRIVATE_FILE_PATH"
          echo "Planted $PRIVATE_FILE_PATH:"
          cat "$PRIVATE_FILE_PATH"

#### Provisioning provider (presets + pricing)

      - name: Prepare provider
        run: |
          cd golem/provider_0
          echo "MEAN_CYCLIC_BCAST_INTERVAL=10sec" >> .env
          golemsp setup --no-interactive
          ya-provider preset update --no-interactive --name=vm --price="cpu=0.016" --price="duration=1.111"
        env:
          YA_CONSENT_EXTERNAL: "allow"

      - name: Run provider
        run: |
          sudo chown $USER /dev/kvm
          cd golem/provider_0
          golemsp setup --no-interactive
          yagna service run&
          sleep 8
          ya-provider run&
          sleep 30
        env:
          YA_CONSENT_EXTERNAL: "allow"

#### Run the demo

      - name: Read private host file via container escape
        run: |
          cd examples/exploit-path-traversal
          echo "YAGNA_SUBNET=public" > .env
          npm install --silent
          npm run demo
        env:
          YAGNA_APPKEY: 66iiOdkvV29
          YA_PAYMENT_NETWORK: hoodi
          PRIVATE_FILE_PATH: ${{ env.PRIVATE_FILE_PATH }}
          PRIVATE_FILE_MESSAGE: ${{ env.PRIVATE_FILE_MESSAGE }}

      - name: Remove private file
        if: always()
        run: |
          rm -f "$PRIVATE_FILE_PATH"

#### Stop services

      - name: Stop requestor
        if: always()
        run: |
          cd golem/requestor
          yagna service shutdown || true

      - name: Stop provider
        if: always()
        run: |
          cd golem/provider_0
          yagna service shutdown || true

#### Pack and upload logs

      - name: Prepare logs
        if: always()
        run: |
          rm -rf golem/provider_0/providerdir/exe-unit/cache
          tar --zstd -cf demo_logs.tar.zst \
            golem/requestor/yagnadir \
            golem/provider_0/providerdir \
            golem/provider_0/yagnadir || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo_logs.tar.zst
          path: demo_logs.tar.zst
