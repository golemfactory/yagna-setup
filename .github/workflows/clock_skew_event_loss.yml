name: Clock-skew event loss

# Regression test for https://github.com/golemfactory/yagna/pull/3569.
# Runs against the standard yagna release pinned in download_binaries.sh.
# EXPECTED TO FAIL (red) until that release contains the fix - the red job
# is the point: it tracks the bug until a fixed yagna is pinned.

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      empty:
        description: 'Empty option'
        required: false
        default: 'Not used'

jobs:
  run_test:
    name: Clock-skew event loss
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and install binaries
        run: |
          /bin/bash download_binaries.sh

      - name: Allow KVM access
        run: |
          sudo chown $USER /dev/kvm

      - name: Run clock-skew event-loss test
        run: |
          cd examples/clock-skew-event-loss
          ./run_test.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clock-skew-run-logs
          path: |
            examples/clock-skew-event-loss/run/**/*.log
            examples/clock-skew-event-loss/run/provider/yagnadir/activity.db
          if-no-files-found: ignore
