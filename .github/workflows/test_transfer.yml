name: Test transfer

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      empty:
        description: 'Empty option'
        required: false
        default: 'Not used'

jobs:
  run_test:
    name: Test transfer
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      HOODI_GETH_ADDR: ${{ secrets.HOODI_GETH_ADDR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

#### prepare binaries

      - name: Download and install binaries
        run: |
          /bin/bash download_binaries.sh

      - name: Install binaries
        run: |
          sudo mkdir -p /usr/lib/yagna
          sudo mv golem/downloaded/plugins /usr/lib/yagna/plugins
          sudo mv golem/downloaded/* /usr/bin/

#### Central net router is responsible for local communication of the nodes

      - name: Run central-net router
        run: |
          ya-sb-router -l tcp://127.0.0.1:5555&
          echo CENTRAL_NET_HOST=127.0.0.1:5555 >> $GITHUB_ENV

#### Generate requestor/provider runtime directories

      - name: Prepare runtime
        run: |
          python advanced/prepare_runtime.py --mode central --num-providers 1

#### No real funds: the erc20 driver is told to skip allocation validation
#### (YAGNA_DEV_SKIP_ALLOCATION_VALIDATION), so allocations validate as funded.

      - name: Configure requestor without funding
        run: |
          cd golem/requestor
          {
            echo "YAGNA_AUTOCONF_APPKEY=66iiOdkvV29"
            echo "YAGNA_APPKEY=66iiOdkvV29"
            echo "YA_PAYMENT_NETWORK=hoodi"
            echo "YAGNA_DEV_SKIP_ALLOCATION_VALIDATION=1"
            # gftp runs outside this directory, so share an explicit bus address.
            echo "GSB_URL=tcp://127.0.0.1:7464"
          } >> .env
          echo "----- requestor .env -----"
          cat .env

      - name: Run requestor
        run: |
          cd golem/requestor
          yagna service run&
          sleep 6
          yagna app-key list

#### Provisioning provider (presets + pricing), mirroring the debit note test

      - name: Prepare provider
        run: |
          cd golem/provider_0
          # faster offer propagation on a cold local net
          echo "MEAN_CYCLIC_BCAST_INTERVAL=10sec" >> .env
          cat .env
          golemsp setup --no-interactive
          ya-provider preset list
          ya-provider preset update --no-interactive --name=vm --price="cpu=0.016" --price="duration=1.111"
          ya-provider preset list
        env:
          YA_CONSENT_EXTERNAL: "allow"

      - name: Run provider
        run: |
          sudo chown $USER /dev/kvm
          cd golem/provider_0
          golemsp setup --no-interactive
          yagna service run&
          sleep 8
          ya-provider run&
          # give the provider time to subscribe and broadcast its offer
          # before the requestor starts looking for it
          sleep 30
          env > yagnadir/env.log
        env:
          YA_CONSENT_EXTERNAL: "allow"

#### Run the actual transfer round-trip test

      - name: Run transfer round-trip test
        run: |
          cd examples/transfertest
          echo "YAGNA_SUBNET=public" > .env
          npm install --silent
          npm test
        env:
          YAGNA_APPKEY: 66iiOdkvV29
          YA_PAYMENT_NETWORK: hoodi
          # The SDK-spawned gftp must use the requestor's identity service.
          GSB_URL: tcp://127.0.0.1:7464

#### Stop services

      - name: Stop requestor
        if: always()
        run: |
          cd golem/requestor
          yagna service shutdown || true

      - name: Stop provider
        if: always()
        run: |
          cd golem/provider_0
          yagna service shutdown || true

#### Pack and upload logs

      - name: Prepare logs
        if: always()
        run: |
          rm -rf golem/provider_0/providerdir/exe-unit/cache
          tar --zstd -cf transfer_logs.tar.zst \
            golem/requestor/yagnadir \
            golem/provider_0/providerdir \
            golem/provider_0/yagnadir || true

      - name: Redact RPC credentials from logs
        id: redact_logs
        if: always()
        run: python advanced/redact_rpc_archive.py transfer_logs.tar.zst

      - name: Upload logs
        if: always() && steps.redact_logs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transfer_logs.tar.zst
          path: transfer_logs.tar.zst
